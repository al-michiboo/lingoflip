<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; background: #111827; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
    .lr-popup { padding: 14px; }
    .lr-popup-title { font-size: 15px; font-weight: 700; color: #7dd3fc; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .lr-status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
    .lr-dot { width: 8px; height: 8px; border-radius: 50%; }
    .lr-dot-on  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .lr-dot-off { background: #6b7280; }
    .lr-lang-row { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); border-radius: 7px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
    .lr-lang-label { color: #9ca3af; }
    .lr-lang-val   { color: #86efac; font-weight: 600; }
    .lr-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }
    .lr-links { display: flex; flex-direction: column; gap: 5px; }
    .lr-link-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e5e7eb;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: system-ui, sans-serif;
      transition: background 0.15s;
    }
    .lr-link-btn:hover { background: rgba(255,255,255,0.16); }
    .lr-footer { font-size: 10px; color: #4b5563; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="lr-popup">
    <div class="lr-popup-title">🌐 Language Reactor</div>

    <div class="lr-status">
      <div class="lr-dot lr-dot-on" id="lr-status-dot"></div>
      <span id="lr-status-text">Active on this page</span>
    </div>

    <div class="lr-lang-row">
      <span class="lr-lang-label">Learning (L2)</span>
      <span class="lr-lang-val" id="lr-l2">Spanish</span>
    </div>
    <div class="lr-lang-row">
      <span class="lr-lang-label">Native (L1)</span>
      <span class="lr-lang-val" id="lr-l1">English</span>
    </div>

    <hr class="lr-divider">

    <div class="lr-links">
      <button class="lr-link-btn" id="lr-btn-vocab">📚 Vocabulary</button>
      <button class="lr-link-btn" id="lr-btn-settings">⚙️ Settings</button>
      <button class="lr-link-btn" id="lr-btn-toggle" id="lr-btn-toggle">⏸ Pause Extension</button>
    </div>

    <div class="lr-footer">Language Reactor v1.0.0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
